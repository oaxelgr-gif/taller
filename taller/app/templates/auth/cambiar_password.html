{% extends "base.html" %}
{% import '_macros.html' as m with context %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>Cambiar contraseña</h1><p class="sub">Elige una contraseña segura que no uses en otros sitios.</p></div>
</div>
<div class="row">
  <div class="col-xl-5 col-lg-7">
    <form method="post" class="glass panel" autocomplete="off">
      {{ m.csrf() }}
      <div class="mb-3">
        <label class="form-label" for="actual">Contraseña actual</label>
        <input type="password" class="form-control" id="actual" name="actual" autocomplete="current-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="nueva">Nueva contraseña</label>
        <input type="password" class="form-control" id="nueva" name="nueva" minlength="8" autocomplete="new-password" required>
        <div class="form-text text-faint">Mínimo 8 caracteres, con letras y números.</div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirmar">Confirmar nueva contraseña</label>
        <input type="password" class="form-control" id="confirmar" name="confirmar" minlength="8" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-shield-check"></i> Actualizar contraseña</button>
    </form>
  </div>
</div>
{% endblock %}
