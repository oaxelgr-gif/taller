{% extends "base.html" %}
{% import '_macros.html' as m with context %}
{% block title %}Clientes{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>Clientes</h1><p class="sub">Directorio de clientes y sus vehículos.</p></div>
  <div class="page-actions">
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCliente"><i class="bi bi-person-plus"></i> Nuevo cliente</button>
  </div>
</div>

<form class="glass filtros" data-live data-target="#tabla" action="{{ url_for('clientes.index') }}" role="search">
  <div class="search-box">
    <i class="bi bi-search"></i>
    <input type="search" class="form-control" name="q" value="{{ q }}" placeholder="Buscar por nombre, teléfono, correo o placas…" autocomplete="off" aria-label="Buscar clientes">
    <span class="spinner"></span>
  </div>
</form>

<div class="glass panel p-2 p-md-3" id="tabla">{% include 'clientes/_tabla.html' %}</div>

<div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true" data-form-modal data-titulo-nuevo="Nuevo cliente" data-titulo-editar="Editar cliente">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" method="post" action="{{ url_for('clientes.guardar') }}" data-ajax data-validate novalidate>
      {{ m.csrf() }}
      <input type="hidden" name="id_cliente">
      <div class="modal-header"><h5 class="modal-title">Nuevo cliente</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label" for="c-nombre">Nombre completo *</label>
          <input class="form-control" id="c-nombre" name="nombre_completo" maxlength="120" required autocomplete="off"></div>
        <div class="row g-3">
          <div class="col-sm-6"><label class="form-label" for="c-tel">Teléfono *</label>
            <input class="form-control" id="c-tel" name="telefono" type="tel" inputmode="tel" maxlength="20" required></div>
          <div class="col-sm-6"><label class="form-label" for="c-correo">Correo</label>
            <input class="form-control" id="c-correo" name="correo" type="email" inputmode="email" maxlength="100"></div>
        </div>
        <div class="mt-3"><label class="form-label" for="c-dir">Dirección</label>
          <textarea class="form-control" id="c-dir" name="direccion" rows="2"></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Guardar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
