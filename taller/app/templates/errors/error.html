{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card glass-strong text-center">
    <div class="error-code">{{ codigo }}</div>
    <h1 class="h4 mt-2">{{ titulo }}</h1>
    <p class="text-muted">{{ mensaje }}</p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a href="javascript:history.back()" class="btn btn-glass"><i class="bi bi-arrow-left"></i> Volver</a>
      <a href="{{ url_for('auth.index') }}" class="btn btn-primary"><i class="bi bi-house"></i> Ir al inicio</a>
    </div>
  </div>
</div>
{% endblock %}
