services:
  db:
    image: postgres:15-alpine
    container_name: taller_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taller_mecanico}
      POSTGRES_USER: ${DB_USER:-taller_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taller_pass}
    volumes:
      - taller_postgres_data:/var/lib/postgresql/data
    # Sólo accesible desde esta computadora (pgAdmin, psql); no desde la red del taller.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taller_user} -d ${DB_NAME:-taller_mecanico}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - taller_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taller_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
      FLASK_DEBUG: 0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taller_mecanico}
      DB_USER: ${DB_USER:-taller_user}
      DB_PASSWORD: ${DB_PASSWORD:-taller_pass}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      TALLER_NOMBRE: ${TALLER_NOMBRE:-SGT Mecánico}
      PORT: 5000
      SESSION_COOKIE_SECURE: 0
      UPLOAD_FOLDER: /app/uploads
      # IP de esta computadora en la red local (la detecta iniciar.sh) para el QR de celulares
      IP_SERVIDOR: ${IP_SERVIDOR:-}
      PUERTO_PUBLICO: ${PUERTO_WEB:-5000}
      # 1 = cargar usuarios y catálogo de demostración en una base vacía (sólo para pruebas)
      CARGAR_DEMO: ${CARGAR_DEMO:-0}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${PUERTO_WEB:-5000}:5000"
    volumes:
      - ./app/static/img:/app/app/static/img
      # Fotos de anomalías: fuera del contenedor para que sobrevivan a reconstrucciones
      - ./uploads:/app/uploads
    networks:
      - taller_network

volumes:
  taller_postgres_data:
    name: taller_postgres_data

networks:
  taller_network:
    name: taller_network
